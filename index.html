<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test-2</title>
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/script.js"></script>
</head>

<body>
  <div class="game-container">
    <header class="game-header">
      <h1>MORTAL KOMBAT MEMORY</h1>
      <div class="game-hud">
        <div class="stat">Time: <span id="timeDisplay">00:00</span></div>
        <div class="stat">Moves: <span id="movesDisplay">0</span></div>
      </div>
    </header>
    
    <main id="gameBoardContainer">
    </main>
  </div>

  <div id="gameOverModal" class="modal hidden">
    <div class="modal-content">
      <h2 class="fatality-text">FATALITY!</h2>
      <p>Time: <span id="finalTime">00:00</span></p>
      <p>Moves: <span id="finalMoves">0</span></p>
      <button id="restartBtn" class="mk-btn">PLAY AGAIN</button>
    </div>
  </div>
</body>
</html>
